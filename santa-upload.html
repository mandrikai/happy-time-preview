<!doctype html>
<html lang="ru" class="santa-background santa-snow-background">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee3">
  <title>Загрузить фото ребёнка · Happy Time</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="landing.css?v=cream-f4">
  <link rel="stylesheet" href="santa.css?v=cream-f4">
  <link rel="stylesheet" href="santa-upload.css?v=4">
  <script src="santa.js?v=heic-upload" type="module"></script>
</head>
<body class="ht-page clay-santa" data-static-preview>
  <div class="hero-snowfall" aria-hidden="true"></div>
  <div class="santa-header-band">
    <header class="site-header ht-shell">
      <a href="./" class="site-brand"><span class="clay-wordmark clay-lettering"><span>Happy</span> <span>Time</span></span></a>
      <a class="santa-nav" href="santa.html"><svg class="ht-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></svg>К выбору фото</a>
    </header>
  </div>
  <main class="up ht-shell">
    <div class="up-heading">
      <h1 class="up-title clay-lettering"><span><b>З</b>агрузите</span> <span>фото</span> <span>реб<b>ё</b>нка</span></h1>
      <p id="santa-instructions" class="up-hint"></p>
    </div>
    <div class="santa-upload-panel up-panel">
      <form id="santa-form" hidden>
        <label class="santa-picker up-picker">
          <input id="santa-file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" required
            aria-labelledby="santa-picker-text" aria-describedby="santa-file-hint santa-file-error">
          <span class="santa-picker-body up-frame">
            <img id="santa-preview" alt="" hidden>
            <img class="up-art" src="art/clay-ded-moroz.webp" width="1024" height="820" alt="">
            <span id="santa-picker-text" class="ht-button clay-button up-pick">Загрузить фото</span>
            <span id="santa-file-hint">JPG, PNG, WebP или HEIC до 7 МБ</span>
            <span id="santa-filename" hidden></span>
          </span>
        </label>
        <p id="santa-file-error" role="status"></p>
        <label class="santa-consent up-consent">
          <input id="santa-consent" type="checkbox" disabled required>
          <span>Я родитель или законный представитель ребёнка и согласен(на) на обработку фото сервисом ИИшка для создания снимка.</span>
        </label>
        <label id="santa-code-field" hidden>Код доступа <input id="santa-code" type="password" autocomplete="off"></label>
        <button id="santa-submit" class="ht-button clay-button up-cta" type="submit" disabled>Создать фото</button>
      </form>
      <noscript><p>Для загрузки фотографии включите JavaScript в браузере.</p></noscript>
      <p id="santa-status" role="status" aria-live="polite">В превью фото показывается в рамке. Создание фото доступно в полной версии сайта.</p>
      <section id="santa-result" class="up-result" aria-labelledby="santa-result-title" hidden>
        <h2 id="santa-result-title" class="up-result-title clay-lettering" tabindex="-1"><span><b>Ф</b>ото</span> <span>г<b>о</b>тово</span></h2>
        <span class="up-result-frame"><img id="santa-photo" alt="Готовое фото с Дедом Морозом"></span>
        <a id="santa-download" class="ht-button clay-button up-cta" download>Скачать фото</a>
      </section>
    </div>
  </main>
  <div class="up-footer-band">
    <footer class="site-footer ht-shell">
      <a href="./" class="site-brand"><span class="clay-wordmark clay-lettering"><span>Happy</span> <span>Time</span></span></a>
      <p>Happy Time · семейная парикмахерская · Пушкин</p>
    </footer>
  </div>
</body>
</html>
