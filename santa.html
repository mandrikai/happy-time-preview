<!doctype html>
<html lang="ru" class="santa-background santa-snow-background">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ee">
  <title>Фото с Дедом Морозом · Happy Time</title>
  <link rel="icon" href="logo.png">
  <link rel="preload" as="image" href="santa-examples/sleeping-result.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="landing.css?v=title-ink">
  <link rel="stylesheet" href="santa.css?v=winter-button-shadow">
  <link rel="stylesheet" href="santa-v2.css?v=7">
</head>
<body class="ht-page clay-santa">
  <div class="hero-snowfall" aria-hidden="true"></div>
  <div class="santa-header-band">
    <header class="site-header ht-shell">
      <a href="./" class="site-brand"><span class="clay-wordmark clay-lettering"><span>Happy</span> <span>Time</span></span></a>
      <a class="santa-nav" href="./">Меню</a>
    </header>
  </div>

  <main class="pick ht-shell">
    <h1 class="pick-title clay-lettering"><span><b>К</b>акое</span> <span>у</span> <span><b>в</b>ас</span> <span>ф<b>о</b>то?</span></h1>

    <div class="pick-toggle" role="radiogroup" aria-label="Какое фото у вас есть">
      <span class="pick-toggle-pill" aria-hidden="true"></span>
      <button type="button" role="radio" aria-checked="true" data-mode="sleeping">Ребёнок спит<span class="pick-badge">Рекомендуем</span></button>
      <button type="button" role="radio" aria-checked="false" data-mode="ordinary">Обычное фото</button>
    </div>

    <figure class="pick-stage">
      <div class="pick-photos">
        <div class="pick-window">
          <img class="pick-before" src="santa-examples/sleeping-original.jpg" width="637" height="850" alt="Спящая девочка до обработки">
          <div class="pick-reveal">
            <img class="pick-after" src="santa-examples/sleeping-result.jpg" width="564" height="850" alt="Дед Мороз рядом со спящей девочкой">
          </div>
          <span class="pick-tag pick-tag-before" aria-hidden="true">до</span>
          <span class="pick-tag pick-tag-after" aria-hidden="true">после</span>
          <span class="pick-track" aria-hidden="true">
            <span class="pick-handle"></span>
            <span class="pick-knob-position">
              <svg class="pick-knob" viewBox="0 0 24 24"><path d="M9 6 3 12l6 6M15 6l6 6-6 6"/></svg>
            </span>
          </span>
          <input class="pick-range" type="range" min="0" max="100" value="30" autocomplete="off" aria-label="Сравнить фото до и после">
        </div>
        <img class="pick-frame" src="art/clay-photo-frame-slider.webp" width="520" height="780" alt="">
      </div>
      <figcaption class="pick-note" aria-live="polite">Сфотографируйте спящего ребёнка, так внешность сохранится на 100%</figcaption>
    </figure>

    <a class="ht-button clay-button pick-cta" href="santa-upload.html?mode=sleeping">Загрузить фото</a>
  </main>

  <script src="santa-v2.js?v=6" defer></script>
</body>
</html>
